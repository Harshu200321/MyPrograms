
<html>
<head>
    <title>Video, Nav, Hover Image Example</title>
    <style>
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        
        .hover-image {
      width: 80%;       
      max-width: 1000px; 
      height: auto;      
      border: 4px solid #444;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

        .hover-image:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        
        .content {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<nav>
    <a href="">Home</a>
    <a href="#">Videos</a>
    <a href="">Gallery</a>
    <a href="">Contact</a>
</nav>

<div class="content">
    <h2>Video with Controls</h2>
    <video width="640" height="360" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Image Hover Effect</h2>
    <img src="whatsapp.jpeg" alt="Hover me!" class="hover-image" type="Image/jpeg">
</div>

</body>
</html>
